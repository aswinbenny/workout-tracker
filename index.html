<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- PWA Meta Tags -->
  <title>Lift</title>
  <meta name="description" content="Offline-first personal workout tracker">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  
  <!-- Apple Specific PWA Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lift">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">

  <!-- Core Libraries -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"Helvetica Neue"', 'sans-serif'],
          },
          colors: {
            brand: '#0A84FF',
            brandGreen: '#30D158',
            darkBg: '#000000',
            darkCard: '#1C1C1E',
            darkInput: '#2C2C2E',
            lightBg: '#F2F2F7',
            lightCard: '#FFFFFF',
            lightInput: '#E5E5EA',
          }
        }
      }
    }
  </script>

  <!-- Application Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-lightBg dark:bg-darkBg text-black dark:text-white transition-colors duration-300 w-full h-[100dvh] overflow-hidden flex justify-center">
  
  <div id="root" class="w-full max-w-md h-full flex flex-col relative shadow-2xl bg-lightBg dark:bg-darkBg"></div>

  <!-- Shared JS Utilities & Constants -->
  <script type="text/babel" src="js/constants.js"></script>
  <script type="text/babel" src="js/icons.js"></script>
  <script type="text/babel" src="js/storage.js"></script>

  <!-- React Components -->
  <script type="text/babel" src="components/InputModal.js"></script>
  <script type="text/babel" src="components/ConfirmModal.js"></script>
  <script type="text/babel" src="components/ExercisePicker.js"></script>
  <script type="text/babel" src="components/HomeScreen.js"></script>
  <script type="text/babel" src="components/WorkoutScreen.js"></script>
  <script type="text/babel" src="components/HistoryScreen.js"></script>
  <script type="text/babel" src="components/PlanScreen.js"></script>
  <script type="text/babel" src="components/SettingsScreen.js"></script>
  
  <!-- Main Application Bootstrap -->
  <script type="text/babel" src="js/app.js"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(registration => console.log('ServiceWorker registered successfully'))
          .catch(err => console.log('ServiceWorker registration failed: ', err));
      });
    }
  </script>
</body>
</html>
